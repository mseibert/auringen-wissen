name: PR Build

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# `pnpm install` führt postinstall-Skripte aus dem PR-Code aus. Der Job braucht
# nur Lesen; ohne diesen Block stünde dem Token der Repo-Default offen.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      # Prüfquelle ist der Fixture, nicht der Live-Kalender.
      - run: pnpm build
        env:
          EVENTS_ICS_URL: .github/fixtures/calendar.ics
